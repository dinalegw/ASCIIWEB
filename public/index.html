<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCIIWEB Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>ASCIIWEB</h1>
      <p class="subtitle">Convert HTML to ASCII Art</p>
    </header>

    <main>
      <div class="input-section">
        <label for="html-input">HTML Input:</label>
        <textarea id="html-input" placeholder="Enter HTML here..."><div style="width:100px;height:50px;background:red"></div></textarea>
        <button id="generate-btn">Generate ASCII</button>
      </div>

      <div class="output-section">
        <label>ASCII Output:</label>
        <pre id="ascii-output" class="ascii-display"></pre>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
